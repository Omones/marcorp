<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Чистый P2P Чат</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #e5ddd5; }
        .container { width: 100%; height: 100%; display: flex; flex-direction: column; background: #fff; }
        .hidden { display: none !important; }
        
        .setup-screen { padding: 15px; display: flex; flex-direction: column; gap: 10px; height: 100%; overflow-y: auto; background: #f4f3f0; }
        textarea { width: 100%; height: 70px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; resize: none; font-size: 11px; }
        
        .chat-header { background: #075e54; color: white; padding: 15px; font-weight: bold; text-align: center; }
        #messages-box { flex: 1; padding: 15px; overflow-y: auto; background: #f4f3f0; display: flex; flex-direction: column; gap: 10px; }
        .msg { padding: 10px 14px; border-radius: 15px; max-width: 75%; word-break: break-word; align-self: flex-start; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .msg.my-message { background: #dcf8c6; align-self: flex-end; }
        .msg-meta { font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #128c7e; }
        .input-area { padding: 15px; background: #f0f0f0; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #fff; border-radius: 20px; outline: none; font-size: 16px; background: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        button { padding: 12px 20px; background: #075e54; color: white; border: none; font-weight: bold; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ЭКРАН СОПРЯЖЕНИЯ -->
        <div id="setup-screen" class="setup-screen">
            <div style="border: 1px solid #ddd; padding: 12px; border-radius: 8px; background: #fff;">
                <h3>Вариант 1: Создать чат</h3>
                <button id="btn-create" style="width:100%; margin-top:5px;">1. Сгенерировать код</button>
                <div id="box-invite" class="hidden" style="margin-top:5px;">
                    <p>Отправьте этот код второму браузеру:</p>
                    <textarea id="txt-local-offer" readonly></textarea>
                    <p style="margin-top:5px;">Вставьте ответный код снизу:</p>
                    <textarea id="txt-remote-answer" placeholder="Сюда ответ..."></textarea>
                    <button id="btn-accept" style="width:100%; margin-top:5px; background:#25d366;">2. Подключиться</button>
                </div>
            </div>

            <div style="text-align:center; font-weight:bold; color:#777;">ИЛИ</div>

            <div style="border: 1px solid #ddd; padding: 12px; border-radius: 8px; background: #fff;">
                <h3>Вариант 2: Войти в чат</h3>
                <p>Вставьте полученный код:</p>
                <textarea id="txt-remote-offer" placeholder="Сюда код приглашения..."></textarea>
                <button id="btn-join" style="width:100%; margin-top:5px;">1. Создать ответный код</button>
                <div id="box-answer" class="hidden" style="margin-top:5px;">
                    <p>Передайте этот ответ первому браузеру обратно:</p>
                    <textarea id="txt-local-answer" readonly></textarea>
                </div>
            </div>
        </div>

        <!-- ЭКРАН ЧАТА -->
        <div id="chat-screen" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
            <div class="chat-header" id="chat-title">💬 P2P Чат</div>
            <div id="messages-box"></div>
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Напишите сообщение..." maxlength="400">
                <button id="send-btn">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        // Чистый локальный WebRTC без серверов. 
        // Внутренние IP браузер определяет сам, внешние ресурсы не опрашиваются.
        const pc = new RTCPeerConnection({ iceServers: [] });
        let dc = null;

        const myUsername = Array.from({length: 3}, () => String.fromCharCode(65 + Math.floor(Math.random() * 26))).join('');
        document.getElementById('chat-title').textContent = `💬 P2P Чат (${myUsername})`;

        const setupScreen = document.getElementById('setup-screen');
        const chatScreen = document.getElementById('chat-screen');
        const messagesBox = document.getElementById('messages-box');
        const msgInput = document.getElementById('msg-input');

        function initDc() {
            dc.onopen = () => {
                setupScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');
                msgInput.focus();
            };
            dc.onmessage = (e) => {
                try { appendMessage(JSON.parse(e.data)); } catch(err) {}
            };
        }

        // Логика Создателя (Вариант 1)
        document.getElementById('btn-create').onclick = async () => {
            document.getElementById('box-invite').classList.remove('hidden');
            dc = pc.createDataChannel("chat");
            initDc();

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            
            // Собираем данные в одну строку
            setTimeout(() => {
                document.getElementById('txt-local-offer').value = btoa(JSON.stringify(pc.localDescription));
            }, 500);
        };

        document.getElementById('btn-accept').onclick = async () => {
            const val = document.getElementById('txt-remote-answer').value.trim();
            if(!val) return;
            await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(atob(val))));
        };

        // Логика Присоединяющегося (Вариант 2)
        document.getElementById('btn-join').onclick = async () => {
            const val = document.getElementById('txt-remote-offer').value.trim();
            if(!val) return;
            document.getElementById('box-answer').classList.remove('hidden');

            pc.ondatachannel = (e) => {
                dc = e.channel;
                initDc();
            };

            await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(atob(val))));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            setTimeout(() => {
                document.getElementById('txt-local-answer').value = btoa(JSON.stringify(pc.localDescription));
            }, 500);
        };

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || !dc || dc.readyState !== "open") return;

            const payload = { sender: myUsername, text: text, isMe: true };
            dc.send(JSON.stringify({ sender: myUsername, text: text, isMe: false }));
            
            appendMessage(payload);
            msgInput.value = '';
        }

        function appendMessage(data) {
            const msgEl = document.createElement('div');
            msgEl.className = `msg ${data.isMe ? 'my-message' : ''}`;
            msgEl.innerHTML = `<div class="msg-meta">${escapeHTML(data.sender)}</div><div>${escapeHTML(data.text)}</div>`;
            messagesBox.appendChild(msgEl);
            messagesBox.scrollTop = messagesBox.scrollHeight;
        }

        document.getElementById('send-btn').onclick = sendMessage;
        msgInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, t => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[t] || t)); }
    </script>
</body>
</html>
