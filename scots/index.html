<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCOTS - Учет заказов</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="taxi-body">

    <div class="taxi-top-bar">
        <div class="taxi-logo">SCOTS</div>
        <div class="taxi-tab active">Заказы клиентов (Журнал)</div>
    </div>

    <div class="taxi-command-panel">
        <button class="taxi-btn taxi-btn-accent" id="top-create-btn">➕ Создать заказ</button>
        <div style="margin-left: auto; display: flex; align-items: center; font-weight: bold; font-size: 15px;">
            Маржа (исполненные):&nbsp;<span id="total-profit-counter" style="color: var(--taxi-status-green-text); background: var(--taxi-status-green-bg); padding: 4px 10px; border-radius: 4px; border: 1px solid #bbf7d0;">0 р.</span>
        </div>
    </div>

    <div class="taxi-container">
        <div class="taxi-workspace-card">
            <div class="table-responsive">
                <table class="taxi-table">
                    <thead>
                        <tr>
                            <th style="width: 60px;">Номер</th>
                            <th style="width: 130px;">Дата</th>
                            <th style="width: 110px;">План. приб.</th>
                            <th>Клиент</th>
                            <th>Номенклатура</th>
                            <th style="width: 110px;">Сумма</th>
                            <th style="width: 160px;">Статус</th>
                            <th style="width: 110px;">МАРЖА</th>
                            <th style="width: 90px; text-align: center;">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="orders-table-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="order-modal" class="modal">
        <div class="taxi-form-window">
            <div class="taxi-window-header">
                <span id="modal-order-title">Заказ клиента</span>
                <span class="close-modal-btn">&times;</span>
            </div>
            <form id="modal-form">
                <div class="taxi-window-body">
                    <div class="taxi-form-section">
                        <div class="taxi-section-title">Основное</div>
                        <div class="taxi-grid">
                            <div class="form-group">
                                <label>Дата документа</label>
                                <input type="datetime-local" id="modal-date" style="width: 100%;" required>
                            </div>
                            <div class="form-group">
                                <label>Плановая дата прибытия</label>
                                <input type="date" id="modal-delivery-date" style="width: 100%;">
                            </div>
                            <div class="form-group">
                                <label>Клиент</label>
                                <input type="text" id="modal-customer" style="width: 100%;" list="modal-customers-datalist" required autocomplete="off">
                                <datalist id="modal-customers-datalist"></datalist>
                            </div>
                            <div class="form-group">
                                <label>Статус оплаты и оформления</label>
                                <select id="modal-status" style="width: 100%;">
                                    <option value="ожидает оплаты">ожидает оплаты</option>
                                    <option value="оплачен, оформляется">оплачен, оформляется</option>
                                    <option value="ожидаем поставку">ожидаем поставку</option>
                                    <option value="ожидает клиента">ожидает клиента</option>
                                    <option value="исполнен">исполнен</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="taxi-form-section">
                        <div class="taxi-section-title">Товары и номенклатура (Спецификация)</div>
                        <div class="taxi-table-toolbar">
                            <select id="modal-add-select" class="taxi-select-sm"></select>
                            <button type="button" id="modal-add-item-btn" class="taxi-btn-sm">➕ Добавить номенклатуру</button>
                        </div>
                        <div class="taxi-table-wrapper">
                            <table class="taxi-table" style="table-layout: auto;">
                                <thead>
                                    <tr>
                                        <th>Наименование товара</th>
                                        <th style="width: 100px; text-align: right;">Цена продажи</th>
                                        <th style="width: 100px; text-align: right;">Себестоимость</th>
                                        <th style="width: 60px; text-align: right;">Кол-во</th>
                                        <th style="width: 60px; text-align: center;">Удалить</th>
                                    </tr>
                                </thead>
                                <tbody id="modal-items-body">
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="taxi-form-section">
                        <div class="taxi-grid">
                            <div class="form-group">
                                <label>Логистические расходы (Доставка)</label>
                                <input type="number" id="modal-shipping" style="width: 100%;" value="0">
                            </div>
                            <div class="form-group">
                                <label>Всего по документу (Итого сумма)</label>
                                <input type="number" id="modal-total" class="taxi-total-field" style="width: 100%;" value="0" readonly>
                            </div>
                            <div class="form-group" style="grid-column: span 2;">
                                <label>Комментарий к сделке</label>
                                <textarea id="modal-comments" style="width: 100%; height: 60px; resize: vertical;" placeholder="Условия логистики, адрес доставки..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="taxi-window-actions">
                        <button type="submit" class="taxi-btn taxi-btn-save">Сохранить и закрыть</button>
                        <button type="button" id="modal-cancel-btn" class="taxi-btn">Отмена</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="catalog.js"></script>
    <script src="orders.js"></script>
    <script src="table.js"></script>
</body>
</html>
